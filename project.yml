name: vimember
options:
  bundleIdPrefix: com.brycez021
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.1"
targets:
  vimember:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: vimember/App
      - path: vimember/Domain
      - path: vimember/Features
      - path: vimember/Services
      - path: vimember/Resources/Assets.xcassets
        buildPhase: resources
      - path: vimember/Resources/AppIcon.icon
        buildPhase: resources
    info:
      path: vimember/Info.plist
      properties:
        CFBundleDisplayName: Vimory
        CFBundleName: Vimory
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Vimory needs access to videos you choose from your photo library."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brycez021.vimember
        TARGETED_DEVICE_FAMILY: "1"
